spring.application.name=quesale-api

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/quesale?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method

app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:*}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.verification.required=${EMAIL_VERIFICATION_REQUIRED:false}
app.verification.base-url=${APP_PUBLIC_URL:http://localhost:8080}
app.verification.ttl-hours=${EMAIL_VERIFICATION_TTL_HOURS:24}
app.verification.resend-cooldown-seconds=${EMAIL_VERIFICATION_RESEND_COOLDOWN:60}
app.mail.from=${MAIL_FROM:no-reply@quesale.local}
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.enabled=${AUTH_ENABLED:true}

app.calls.stun-urls=${CALLS_STUN_URLS:stun:stun.l.google.com:19302}
app.calls.turn-urls=${CALLS_TURN_URLS:}
app.calls.turn-secret=${CALLS_TURN_SECRET:}
app.calls.turn-ttl-seconds=${CALLS_TURN_TTL_SECONDS:3600}

