<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Qué sale? · Prueba del chat en tiempo real</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.3rem; }
    fieldset { margin: 1rem 0; border: 1px solid #ccc; border-radius: 8px; }
    label { display: block; margin: .4rem 0 .15rem; font-size: .9rem; }
    input, button { font: inherit; padding: .4rem .6rem; }
    input { width: 100%; box-sizing: border-box; }
    button { margin-top: .6rem; cursor: pointer; }
    #estado { font-weight: 600; }
    #log { list-style: none; padding: 0; }
    #log li { padding: .4rem .6rem; margin: .3rem 0; border-radius: 6px; background: #f3f3f3; font-size: .9rem; }
    #log li.recibido { background: #e7f6ea; }
    #log li.error { background: #fdeaea; }
  </style>
</head>
<body>
  <h1>Prueba del chat en tiempo real</h1>
  <p>Abre esta página en dos pestañas con estudiantes distintos. REST guarda el mensaje y el WebSocket lo entrega al instante.
     Identidad provisional: el id del estudiante (D-16).</p>

  <fieldset>
    <legend>1. Conectarse (recibir)</legend>
    <label for="studentId">Mi id de estudiante</label>
    <input id="studentId" type="number" min="1" value="1">
    <button id="conectar">Conectar</button>
    <button id="desconectar" disabled>Desconectar</button>
    <p>Estado: <span id="estado">desconectado</span></p>
  </fieldset>

  <fieldset>
    <legend>2. Enviar (REST)</legend>
    <label for="destinatario">Id del destinatario</label>
    <input id="destinatario" type="number" min="1" value="2">
    <label for="contenido">Mensaje</label>
    <input id="contenido" type="text" maxlength="1000" value="Hola, ¿vamos por un café?">
    <button id="enviar">Enviar por POST /api/v1/messages</button>
  </fieldset>

  <h2>Mensajes</h2>
  <ul id="log"></ul>

  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let client = null;

    function anotar(texto, clase) {
      const li = document.createElement('li');
      if (clase) li.className = clase;
      li.textContent = texto;
      $('log').prepend(li);
    }

    $('conectar').addEventListener('click', () => {
      if (typeof StompJs === 'undefined') {
        anotar('No se cargó stomp.js desde internet (sin conexión o bloqueado por el navegador). Revisa tu conexión y recarga la página.', 'error');
        return;
      }
      if (location.protocol === 'file:') {
        anotar('Abre esta página desde la API (http://localhost:8080/chat-test.html), no como archivo.', 'error');
        return;
      }
      const id = $('studentId').value;
      const protocolo = location.protocol === 'https:' ? 'wss' : 'ws';
      const url = `${protocolo}://${location.host}/ws?studentId=${encodeURIComponent(id)}`;
      let conectado = false;
      client = new StompJs.Client({
        brokerURL: url,
        reconnectDelay: 0,
        onConnect: () => {
          conectado = true;
          $('estado').textContent = `conectado como estudiante ${id}`;
          $('conectar').disabled = true;
          $('desconectar').disabled = false;
          client.subscribe('/user/queue/messages', (frame) => {
            const m = JSON.parse(frame.body);
            anotar(`De ${m.senderId} (${m.sentAt}): ${m.content}`, 'recibido');
          });
        },
        onWebSocketError: () => anotar(`No se pudo abrir ${url}. ¿La API está corriendo en este host y puerto?`, 'error'),
        onWebSocketClose: () => {
          if (!conectado) anotar('La conexión se cerró antes de iniciar. Reinicia la API para que cargue el WebSocket.', 'error');
          $('estado').textContent = 'desconectado';
          $('conectar').disabled = false;
          $('desconectar').disabled = true;
        },
        onStompError: (frame) => anotar(`Error STOMP: ${frame.headers.message}`, 'error')
      });
      client.activate();
    });

    $('desconectar').addEventListener('click', () => client && client.deactivate());

    $('enviar').addEventListener('click', async () => {
      try {
        const respuesta = await fetch('/api/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Student-Id': $('studentId').value },
          body: JSON.stringify({ recipientId: Number($('destinatario').value), content: $('contenido').value })
        });
        anotar(`POST /api/v1/messages → ${respuesta.status}`, respuesta.ok ? '' : 'error');
      } catch (e) {
        anotar(`No se pudo enviar: ${e.message}`, 'error');
      }
    });
  </script>
</body>
</html>
