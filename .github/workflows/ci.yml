name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B clean test

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Sintaxis de Ansible
        working-directory: infra/ansible
        run: ansible-playbook -i inventory.ini.example site.yml --syntax-check

      - uses: hashicorp/setup-terraform@v3

      - name: Validar Terraform
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: Validar Kustomize
        run: |
          cp infra/k8s/overlays/production/secrets.env.example infra/k8s/overlays/production/secrets.env
          kubectl kustomize infra/k8s/overlays/production > /dev/null
