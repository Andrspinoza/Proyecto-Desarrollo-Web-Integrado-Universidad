- name: Esperar a que las VPS respondan
  hosts: k3s_servers
  gather_facts: false
  tasks:
    - name: Conexión SSH disponible
      ansible.builtin.wait_for_connection:
        timeout: 900

- import_playbook: base.yml
- import_playbook: wireguard.yml
- import_playbook: k3s.yml
- import_playbook: apps.yml
- import_playbook: coturn.yml
