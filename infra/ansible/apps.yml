- name: Aplicación en el clúster
  hosts: k3s_servers[0]
  become: true
  tasks:
    - name: Buscar los valores del entorno
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../k8s/overlays/production/secrets.env"
      delegate_to: localhost
      become: false
      register: secrets_env

    - name: Validar los valores del entorno
      ansible.builtin.assert:
        that: secrets_env.stat.exists
        fail_msg: Falta infra/k8s/overlays/production/secrets.env; genéralo con infra/scripts/preparar.sh

    - name: Carpeta de manifiestos
      ansible.builtin.file:
        path: /opt/quesale
        state: directory
        mode: "0750"

    - name: Copiar manifiestos de Kubernetes
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../k8s/"
        dest: /opt/quesale/k8s/
        mode: preserve

    - name: Instalar cert-manager
      ansible.builtin.command: >
        /usr/local/bin/k3s kubectl apply -f
        https://github.com/cert-manager/cert-manager/releases/download/{{ cert_manager_version }}/cert-manager.yaml
      changed_when: false

    - name: Esperar al webhook de cert-manager
      ansible.builtin.command: /usr/local/bin/k3s kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=240s
      changed_when: false

    - name: Aplicar la aplicación
      ansible.builtin.command: /usr/local/bin/k3s kubectl apply -k /opt/quesale/k8s/overlays/production
      changed_when: false

    - name: Secreto para descargar la imagen de GHCR
      ansible.builtin.shell: >
        /usr/local/bin/k3s kubectl -n quesale create secret docker-registry ghcr-pull
        --docker-server=ghcr.io
        --docker-username={{ ghcr_user }}
        --docker-password={{ ghcr_token }}
        --dry-run=client -o yaml | /usr/local/bin/k3s kubectl apply -f -
      no_log: true
      changed_when: false

    - name: Emisor de certificados
      ansible.builtin.template:
        src: clusterissuer.yaml.j2
        dest: /opt/quesale/clusterissuer.yaml
        mode: "0640"

    - name: Entrada HTTPS
      ansible.builtin.template:
        src: ingress.yaml.j2
        dest: /opt/quesale/ingress.yaml
        mode: "0640"

    - name: Aplicar emisor y entrada
      ansible.builtin.command: "/usr/local/bin/k3s kubectl apply -f {{ item }}"
      loop:
        - /opt/quesale/clusterissuer.yaml
        - /opt/quesale/ingress.yaml
      changed_when: false
